<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebGIS Kabupaten Karawang — ATM, Bank & Rumah Sakit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Teko:wght@400;600;700&family=Barlow:wght@300;400;500&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0b1423; --dark: #111c2e; --panel: #162035; --border: #1e3058;
      --atm: #10b981; --atm-light: #6ee7b7;
      --bank: #3b82f6; --bank-light: #93c5fd;
      --hospital: #ef4444; --hospital-light: #fca5a5;
      --accent: #f59e0b; --text: #e2e8f0; --muted: #64748b;
    }
    html, body { height: 100%; font-family: 'Barlow', sans-serif; background: var(--navy); color: var(--text); overflow: hidden; }
    #header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: linear-gradient(90deg, var(--navy), var(--dark)); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-badge { background: var(--accent); color: var(--navy); font-family: 'Teko', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 2px; padding: 3px 8px; border-radius: 3px; }
    #header h1 { font-family: 'Teko', sans-serif; font-size: 22px; font-weight: 600; letter-spacing: 1px; color: #fff; }
    #header h1 span { color: var(--accent); }
    .header-right { display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--atm-light); display: inline-block; margin-right: 5px; box-shadow: 0 0 6px var(--atm-light); animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    #map { position: fixed; top: 56px; bottom: 0; left: 0; right: 0; z-index: 1; }
    #stats { position: fixed; top: 70px; right: 16px; z-index: 1000; display: flex; flex-direction: column; gap: 8px; }
    .stat-card { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 16px; font-size: 12px; color: var(--muted); min-width: 160px; }
    .stat-card .stat-num { font-family: 'Teko', sans-serif; font-size: 26px; font-weight: 700; line-height: 1; display: block; }
    .stat-card.atm .stat-num { color: var(--atm-light); }
    .stat-card.bank .stat-num { color: var(--bank-light); }
    .stat-card.hospital .stat-num { color: var(--hospital-light); }
    #legend { position: fixed; bottom: 24px; right: 16px; z-index: 1000; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px 18px; min-width: 200px; }
    #legend h3 { font-family: 'Teko', sans-serif; font-size: 15px; letter-spacing: 2px; color: var(--accent); margin-bottom: 10px; text-transform: uppercase; }
    .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .legend-icon { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 2px solid rgba(255,255,255,0.2); }
    .atm-icon { background: var(--atm); box-shadow: 0 0 8px var(--atm); }
    .bank-icon { background: var(--bank); box-shadow: 0 0 8px var(--bank); }
    .hospital-icon { background: var(--hospital); box-shadow: 0 0 8px var(--hospital); }
    #loading { position: fixed; inset: 0; z-index: 2000; background: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; transition: opacity 0.5s; }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { font-family: 'Teko', sans-serif; font-size: 16px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
    .leaflet-popup-content-wrapper { background: var(--panel) !important; border: 1px solid var(--border) !important; border-radius: 8px !important; color: var(--text) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.6) !important; font-family: 'Barlow', sans-serif !important; }
    .leaflet-popup-tip { background: var(--panel) !important; }
    .leaflet-popup-content { margin: 12px 16px !important; font-size: 13px !important; line-height: 1.6 !important; }
    .popup-title { font-family: 'Teko', sans-serif; font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .popup-title.atm { color: var(--atm-light); }
    .popup-title.bank { color: var(--bank-light); }
    .popup-title.hospital { color: var(--hospital-light); }
    .popup-row { display: flex; gap: 6px; margin-bottom: 2px; font-size: 12px; color: var(--muted); }
    .popup-row strong { color: var(--text); min-width: 70px; }
    .leaflet-popup-close-button { color: var(--muted) !important; }
    .error-box { position: fixed; top: 70px; left: 16px; z-index: 1000; background: #7f1d1d; border: 1px solid #ef4444; border-radius: 6px; padding: 10px 14px; font-size: 12px; max-width: 280px; display: none; }
  </style>
</head>
<body>

<div id="loading"><div class="spinner"></div><p>Memuat data peta...</p></div>

<div id="header">
  <div class="header-left">
    <span class="header-badge">WEBGIS</span>
    <h1>Kabupaten <span>Karawang</span> — ATM, Bank & RS</h1>
  </div>
  <div class="header-right">
    <span><span class="dot"></span>OpenStreetMap</span>
    <span>Jawa Barat, Indonesia</span>
  </div>
</div>

<div id="map"></div>

<div id="stats">
  <div class="stat-card atm"><span class="stat-num" id="count-atm">—</span>ATM</div>
  <div class="stat-card bank"><span class="stat-num" id="count-bank">—</span>Bank</div>
  <div class="stat-card hospital"><span class="stat-num" id="count-hospital">—</span>Rumah Sakit</div>
</div>

<div id="legend">
  <h3>Legenda</h3>
  <div class="legend-item"><div class="legend-icon atm-icon"></div>ATM</div>
  <div class="legend-item"><div class="legend-icon bank-icon"></div>Bank</div>
  <div class="legend-item"><div class="legend-icon hospital-icon"></div>Rumah Sakit</div>
</div>

<div class="error-box" id="error-box"></div>

<script>
  const map = L.map('map', { center: [-6.3069, 107.3081], zoom: 12, zoomControl: true });
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  function makeIcon(color, label) {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="40" viewBox="0 0 32 40"><defs><filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="rgba(0,0,0,0.5)"/></filter></defs><path d="M16 0C7.16 0 0 7.16 0 16c0 10 16 24 16 24S32 26 32 16C32 7.16 24.84 0 16 0z" fill="${color}" filter="url(#sh)"/><circle cx="16" cy="16" r="8" fill="white" opacity="0.9"/><text x="16" y="20.5" text-anchor="middle" font-family="Teko,sans-serif" font-size="9" font-weight="700" fill="${color}">${label}</text></svg>`;
    return L.divIcon({ html: svg, iconSize: [32,40], iconAnchor: [16,40], popupAnchor: [0,-42], className: '' });
  }

  const iconATM      = makeIcon('#10b981', 'ATM');
  const iconBank     = makeIcon('#3b82f6', 'BNK');
  const iconHospital = makeIcon('#ef4444', 'RS');

  function buildPopup(props, type) {
    const labelMap = { atm: '💳 ATM', bank: '🏦 Bank', hospital: '🏥 Rumah Sakit' };
    const name   = props.name || props.amenity || props.operator || 'Tidak diketahui';
    const addr   = props['addr:full'] || props['addr:street'] || props['addr:city'] || '—';
    const op     = props.operator || props.brand || '—';
    const network= props.network || '—';
    const osm    = props.osm_id ? `<div class="popup-row"><strong>OSM ID</strong>${props.osm_id}</div>` : '';
    const extra  = type === 'atm'
      ? `<div class="popup-row"><strong>Jaringan</strong>${network}</div>`
      : `<div class="popup-row"><strong>Operator</strong>${op}</div>`;
    return `<div class="popup-title ${type}">${labelMap[type]}</div>
      <div class="popup-row"><strong>Nama</strong>${name}</div>
      <div class="popup-row"><strong>Alamat</strong>${addr}</div>
      ${extra}${osm}`;
  }

  function isHospital(props) {
    const amenity = (props.amenity || '').toLowerCase();
    const name    = (props.name || '').toLowerCase();
    return amenity === 'hospital' || /\brumah sakit\b|\brsud\b|\brsu\b|\bhospital\b|\bklinik\b/.test(name);
  }

  function isATM(props) {
    const amenity = (props.amenity || '').toLowerCase();
    return amenity === 'atm';
  }

  function isBank(props) {
    const amenity = (props.amenity || '').toLowerCase();
    const name    = (props.name || '').toLowerCase();
    return amenity === 'bank' || /\bbank\b|\bbri\b|\bbni\b|\bbca\b|\bmandiri\b|\bbtn\b|\bcimb\b|\bdanamon\b/.test(name);
  }

  function getType(props) {
    if (isHospital(props)) return 'hospital';
    if (isATM(props))      return 'atm';
    if (isBank(props))     return 'bank';
    return 'atm';
  }

  function getIcon(type) {
    if (type === 'hospital') return iconHospital;
    if (type === 'bank')     return iconBank;
    return iconATM;
  }

  function showError(msg) {
    const box = document.getElementById('error-box');
    box.style.display = 'block';
    box.innerHTML += `<div>&#9888; ${msg}</div>`;
  }

  fetch('data/Karawang.geojson')
    .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
    .then(data => {
      let nATM = 0, nBank = 0, nHospital = 0;
      L.geoJSON(data, {
        pointToLayer: (feature, latlng) => {
          const type = getType(feature.properties || {});
          return L.marker(latlng, { icon: getIcon(type) });
        },
        onEachFeature: (feature, layer) => {
          const p = feature.properties || {};
          const type = getType(p);
          layer.bindPopup(buildPopup(p, type), { maxWidth: 260 });
          if (type === 'hospital')  nHospital++;
          else if (type === 'bank') nBank++;
          else                      nATM++;
        }
      }).addTo(map);
      document.getElementById('count-atm').textContent      = nATM;
      document.getElementById('count-bank').textContent     = nBank;
      document.getElementById('count-hospital').textContent = nHospital;
      document.getElementById('loading').classList.add('hidden');
    })
    .catch(err => {
      console.error(err);
      showError('Gagal memuat <b>data/Karawang.geojson</b>. Pastikan file ada di folder <code>data/</code>.');
      document.getElementById('loading').classList.add('hidden');
    });
</script>
</body>
</html>
