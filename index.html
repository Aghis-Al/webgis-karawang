<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>WebGIS Karawang</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<style>
body { margin:0; }
#map { height:100vh; }

.header {
  position:absolute; top:0; width:100%;
  background:linear-gradient(to right,#0f172a,#1e3a8a);
  color:white; display:flex; justify-content:space-between;
  padding:10px 20px; z-index:1000;
}
.logo { background:#3b82f6; padding:5px 10px; border-radius:5px; font-weight:bold;}
.title { font-weight:bold;}
.info { font-size:12px; opacity:0.8;}

.stats {
  position:absolute; top:70px; right:20px;
  background:#0f172a; color:white;
  padding:10px; border-radius:10px; font-size:12px;
  z-index:1000;
}

.legend {
  position:absolute; bottom:20px; right:20px;
  background:#0f172a; color:white;
  padding:10px; border-radius:10px; font-size:12px;
  z-index:1000;
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">WEBGIS</div>
  <div class="title">Karawang - ATM, Bank & RS</div>
  <div class="info">OpenStreetMap</div>
</div>

<div class="stats">
  <div><b id="atm">0</b><br>ATM</div>
  <div><b id="bank">0</b><br>Bank</div>
  <div><b id="rs">0</b><br>Rumah Sakit</div>
</div>

<div class="legend">
<b>LEGENDA</b><br>
🟢 ATM<br>
🔵 Bank<br>
🔴 Rumah Sakit
</div>

<div id="map"></div>

<script>
var map = L.map('map').setView([-6.3,107.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap'
}).addTo(map);

fetch('data/Karawang.geojson')
.then(res=>res.json())
.then(data=>{

let atm=0, bank=0, rs=0;

L.geoJSON(data,{
  pointToLayer:function(feature,latlng){
    let type=feature.properties.amenity;
    let color="blue";

    if(type==="atm"){atm++; color="green";}
    else if(type==="bank"){bank++; color="blue";}
    else if(type==="hospital"){rs++; color="red";}

    return L.circleMarker(latlng,{
      radius:6, fillColor:color, color:"#fff",
      weight:1, fillOpacity:0.9
    });
  },
  onEachFeature:function(feature,layer){
    let nama=feature.properties.name||"Tidak ada nama";
    layer.bindPopup("<b>"+nama+"</b>");
  }
}).addTo(map);

document.getElementById("atm").innerText=atm;
document.getElementById("bank").innerText=bank;
document.getElementById("rs").innerText=rs;

});
</script>
</body>
</html>
