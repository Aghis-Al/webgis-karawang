<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>WebGIS Karawang</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { margin:0; font-family: 'Segoe UI', Arial; }
    #map { height: 100vh; }

    .header {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e3a8a;
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      z-index: 1000;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      z-index: 1000;
    }
  </style>
</head>

<body>

<div class="header">Karawang - ATM, Bank & Faskes</div>

<div id="map"></div>

<div class="legend">
<b>Legenda</b><br>
ATM / Bank<br>
Rumah Sakit / Klinik
</div>

<script>
  var map = L.map('map').setView([-6.3, 107.3], 11);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  fetch('data/Karawang.geojson')
    .then(res => res.json())
    .then(data => {

      L.geoJSON(data, {
        pointToLayer: function(feature, latlng) {
          return L.circleMarker(latlng, {
            radius: 6,
            fillOpacity: 0.8
          });
        },
        onEachFeature: function (feature, layer) {
          let nama = feature.properties.name || "Tidak ada nama";
          let tipe = feature.properties.amenity || "Fasilitas";

          layer.bindPopup("<b>" + nama + "</b><br>" + tipe);
        }
      }).addTo(map);

    })
    .catch(err => {
      alert("GeoJSON Karawang error");
      console.log(err);
    });
</script>

</body>
</html>
